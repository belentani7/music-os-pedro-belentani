name: CI (python)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install midiutil==1.2.1
      - name: Compile application and archive sources
        run: python -m compileall -q .
      - name: Verify music lifecycle and static publication
        run: python -m unittest discover -s tests -p "test_release.py" -v

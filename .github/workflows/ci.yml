name: MUSIC OS — real routing and demo MIDI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q project tests
      - name: Regression tests for Ollama and demo routing
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install lightweight MIDI exporter for functional smoke
        run: python -m pip install 'MIDIUtil>=1.2,<2'
      - name: Generate demo project and MIDI in isolated CI directory
        run: |
          mkdir -p /tmp/music-os-ci
          cd /tmp/music-os-ci
          python "$GITHUB_WORKSPACE/project/stress_test_music_os.py"
          test -s stress_test_report.json
          python -c 'import json; data=json.load(open("stress_test_report.json")); assert data and all(r["status"] == "✅ PASSED" for r in data)'

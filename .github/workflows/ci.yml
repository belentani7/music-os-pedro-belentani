name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Núcleo sin interfaz: solo midiutil. Demuestra que el motor funciona
    # aunque no haya Streamlit instalado.
    name: Núcleo (py${{ matrix.python }} · sin UI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias del núcleo
        run: python -m pip install "midiutil==1.2.1"
      - name: Compilar todos los fuentes
        run: python -m compileall -q .
      - name: Pruebas del núcleo (sin Streamlit)
        run: |
          python -m unittest tests.test_engine tests.test_release -v
          python -m project.stress_test_music_os "$RUNNER_TEMP/stress.json"
      - name: La CLI funciona sin UI
        run: |
          python -m tools.music_os_cli generate --theme "ci" --demo --out "$RUNNER_TEMP/out" --no-files
          python -m tools.music_os_cli generate --theme "ci" --demo --out "$RUNNER_TEMP/out" --json > "$RUNNER_TEMP/summary.json"
          python -m tools.music_os_cli verify "$RUNNER_TEMP"/out/*.mid
          python -m tools.music_os_cli inspect "$RUNNER_TEMP"/out/*.musicir.json
      - name: El repositorio queda limpio tras ejecutar herramientas
        run: test -z "$(git status --porcelain)"

  full:
    name: Suite completa + lint (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Suite completa (núcleo + interfaz + publicación)
        run: python -m unittest discover -s tests -p "test_*.py" -v

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-os-pedro-belentani"
version = "2.0.0"
description = "Taller local de preproducción musical: MusicIR, agentes, MIDI y hoja de sesión."
requires-python = ">=3.10"
dependencies = [
    "midiutil>=1.2.1,<2",
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.49,<2", "pandas>=2.2,<3", "plotly>=5.24,<8"]
dev = ["ruff>=0.6,<1"]

[project.scripts]
music-os = "tools.music_os_cli:main"

[tool.setuptools]
packages = ["project", "tools", "data"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["versions", "docs", "plataforma", "site", "chats"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "PIE", "RUF"]
ignore = [
    "E501",   # la longitud la controla line-length en el formateador
    "N999",   # nombres de módulo históricos del repo
    "RUF001", # signos tipográficos en español (—, «», ¿)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"versions/*" = ["ALL"]
"project/music_os_ui.py" = ["E402"]  # sys.path antes de importar el paquete

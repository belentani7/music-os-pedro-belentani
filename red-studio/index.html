<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELENTANI · RED STUDIO</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#650014,#09090b 55%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:1100px;margin:auto;padding:32px}header{letter-spacing:.3em;font-size:12px}h1{font-size:clamp(48px,10vw,120px);line-height:.9;margin:60px 0 24px;background:linear-gradient(#fff,#ff9da9 30%,#a90024 65%,#ff526e);color:transparent;background-clip:text}section{border:1px solid #ffffff26;border-radius:24px;padding:24px;background:linear-gradient(145deg,#ffffff12,#180008);margin:20px 0;box-shadow:0 20px 60px #0006}button,input,select,textarea{font:inherit;color:inherit;background:#24000a;border:1px solid #ff526e77;border-radius:12px;padding:12px}button{cursor:pointer;background:linear-gradient(#ec2447,#790018);min-height:44px}button:focus-visible{outline:3px solid white}#keys,#steps{display:flex;gap:8px;flex-wrap:wrap}#steps button[aria-pressed=true]{background:#fff;color:#92001e}textarea{width:100%;min-height:120px}label{display:inline-flex;gap:10px;align-items:center;margin:8px}a{color:#ff9da9}h1{background:linear-gradient(180deg,#fff 0%,#ffd5dc 8%,#ff6b85 19%,#a00024 35%,#39000d 47%,#ffb1c0 49%,#f72b52 53%,#87001b 72%,#e94b68 91%,#ffe2e7 100%);background-clip:text;filter:drop-shadow(0 2px 0 #ff8da455) drop-shadow(0 12px 22px #a0002444)}section{background:linear-gradient(155deg,#ffb0be19 0%,#420b19 12%,#16090e 34%,#090709 65%,#340914 100%);border:1px solid #9b5363;box-shadow:inset 0 1px 0 #ffc2ce77,inset 0 -1px 0 #000,0 20px 60px #0009}button{background:linear-gradient(180deg,#ffb4c1 0%,#e74662 12%,#b00029 43%,#620013 49%,#a40024 52%,#df3455 90%,#f18da0 100%);border:1px solid #e9899c;box-shadow:inset 0 1px 0 #fff8,0 4px 9px #0008;text-shadow:0 1px 2px #42000c}button:hover{filter:brightness(1.15)}button:active{transform:translateY(1px)}#steps button[aria-pressed=true]{background:linear-gradient(#fff,#ffb3c1 42%,#e44768 49%,#fff0f3 53%,#ff829c);color:#44000f;text-shadow:none}header{color:#eab3bf}body{background:radial-gradient(ellipse at 80% 0%,#76001c 0%,#290610 27%,transparent 58%),linear-gradient(135deg,#080709,#16090e 55%,#050405)}</style><main><header>BELENTANI / MUSIC OS / 01</header><h1>RED<br>STUDIO.</h1><p>Laboratorio de sonido · Composición · Performance</p><section><h2>01 / Instrumento</h2><label>Onda <select id="wave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></label><div id="keys"></div></section><section><h2>02 / Secuenciador</h2><label>BPM <input id="bpm" type="number" min="40" max="240" value="95"></label><button id="play">Iniciar</button> <button id="stop">Detener</button><div id="steps"></div><p id="status" role="status">En espera</p></section><section><h2>03 / Cuaderno creativo</h2><textarea id="notes" aria-label="Notas de composición" placeholder="Escribe tu próxima idea"></textarea><button id="save">Guardar localmente</button></section></main><script type="module" src="studio.js"></script></html>
